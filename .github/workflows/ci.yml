# CI on every push + PR. 1 job per service so they run in parallel and
# a red X tells me which service broke right away
name: CI

on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run build # tsc
      - run: npm test # vitest - resolvers + worker retry/DLQ logic, AWS mocked

  cpp-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpp-core
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DSOUNDCANVAS_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure # this is where the C++ vs python parity check runs

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      # serving deps (tensorflow, fastapi) + pillow/sklearn for the data tests
      - run: pip install -r ml/requirements.txt pillow scikit-learn
      - run: python -m unittest discover -s ml/tests -v

  audio-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audio-producer/requirements.txt
      # tests never call fluidsynth/ffmpeg -> no apt installs, just pip
      - run: pip install -r audio-producer/requirements.txt
      - run: python -m unittest discover -s audio-producer/tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
