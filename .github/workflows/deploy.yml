# Production deploy, started by hand from the Actions tab: build and push the four images,
# run the database migration, then terraform apply so ECS rolls out the new images.
# The old code is still live while the migration runs, so migrations may only add tables or
# nullable columns. The first deploy must be a manual `terraform apply`, because this workflow
# signs in with a role Terraform creates.
name: Deploy

on: workflow_dispatch

# id-token: write lets the job get a GitHub OIDC token, which AWS swaps for the deploy role
# in infra/terraform/iam.tf. No AWS keys are stored in GitHub.
permissions:
  id-token: write
  contents: read

# Only one deploy at a time; a second one waits for the first.
concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The production environment is the approval gate, and the deploy role only trusts it.
    environment: production
    # TF_VAR_x sets Terraform variable x (infra/terraform/variables.tf). The vars.* values are
    # set on the GitHub production environment.
    env:
      TAG: ${{ github.sha }}
      AWS_REGION: us-east-2
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_bucket_name: ${{ vars.BUCKET_NAME }}
      TF_VAR_frontend_origin: ${{ vars.FRONTEND_ORIGIN }}
      TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      # Assume the deploy role (deploy_role_arn output) for the rest of the job.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Log docker in to ECR; the registry address comes back as an output.
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Each folder has its own Dockerfile. The ECR repos are made by ecs.tf.
      - name: Build and push the four images, tagged with the commit SHA
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for service in api cpp-core ml audio-producer; do
            image="$REGISTRY/soundcanvas/$service:$TAG"
            docker build -t "$image" "$service"
            docker push "$image"
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false # the wrapper adds to stdout, which breaks `terraform output -raw`

      # Read the current infrastructure's names from outputs.tf, for the run-task call below.
      - name: Read where to run the migration
        id: infra
        working-directory: infra/terraform
        run: |
          terraform init -input=false
          echo "cluster=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "subnets=$(terraform output -raw private_subnet_ids)" >> "$GITHUB_OUTPUT"
          echo "security_group=$(terraform output -raw tasks_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "registry=$(terraform output -json ecr_repositories | jq -r .api)" >> "$GITHUB_OUTPUT"

      # The migrate task definition in ecs.tf still points at the old image. Copy it, swap in the
      # new image (jq keeps only the fields register-task-definition accepts), register that,
      # run it once on Fargate, wait for it to stop, and fail the deploy unless it exited 0.
      # api/src/migrate.ts is the code that runs.
      - name: Migrate the database
        run: |
          aws ecs describe-task-definition --task-definition soundcanvas-migrate \
            --query taskDefinition > migrate.json
          jq --arg image "${{ steps.infra.outputs.registry }}:$TAG" \
            '.containerDefinitions[0].image = $image
             | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions,
                requiresCompatibilities, cpu, memory}
             | with_entries(select(.value != null))' migrate.json > migrate-new.json
          task_definition=$(aws ecs register-task-definition --cli-input-json file://migrate-new.json \
            --query taskDefinition.taskDefinitionArn --output text)
          task=$(aws ecs run-task --cluster "${{ steps.infra.outputs.cluster }}" --launch-type FARGATE \
            --task-definition "$task_definition" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.infra.outputs.subnets }}],securityGroups=[${{ steps.infra.outputs.security_group }}]}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "${{ steps.infra.outputs.cluster }}" --tasks "$task"
          exit_code=$(aws ecs describe-tasks --cluster "${{ steps.infra.outputs.cluster }}" --tasks "$task" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migration exit code: $exit_code"
          test "$exit_code" = "0"

      # image_tag is now the new SHA, so every task definition changes and ECS rolls each service.
      # wait_for_steady_state in ecs.tf makes this step fail if the new tasks never get healthy.
      - name: Deploy the new images
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve
