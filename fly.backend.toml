# fly.toml app configuration file generated for soundcanvas-backend-20251201195552 on 2025-12-01T19:55:54-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# COST OPTIMIZED: Auto-stop when idle, minimal resources
# Target: <$5/month for low-traffic personal project
#

app = 'soundcanvas-backend-20251201195552'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile.fly'

[[mounts]]
  source = 'soundcanvas_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  # AUTO-STOP: Machine stops after idle, restarts on request (~3-5s cold start)
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0  # Don't keep any machines running when idle
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 9002
  processes = ['app']

  [[services.ports]]
    port = 9002
    handlers = ['http']

# MINIMAL RESOURCES: shared-cpu-1x with 2GB RAM (needed for audio synthesis)
# Cost: ~$10.70/month if 24/7, but with auto-stop: ~$1-3/month
[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
