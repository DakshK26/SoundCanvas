# fly.toml app configuration file generated for soundcanvas-backend-20251201195552 on 2025-12-01T19:55:54-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# performance-2x stays on only while the app has traffic.
# The gateway pings itself for 15 minutes after the last user request.
# Fly then stops the machine a few minutes after those pings end.
#

app = 'soundcanvas-backend'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile.fly'

[[mounts]]
  source = 'soundcanvas_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  
  # Extended timeout for music generation (values in seconds)
  [http_service.http_options]
    response.read_timeout = 300  # 5 minutes in seconds
    idle_timeout = 300           # 5 minutes in seconds
    response.write_timeout = 300 # 5 minutes in seconds

  # Health check: give the gateway time to boot (MySQL + Node.js startup)
  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "120s"
    method = "GET"
    path = "/health"

[[services]]
  protocol = 'tcp'
  internal_port = 9002
  processes = ['app']
  auto_stop_machines = 'stop'
  auto_start_machines = true

  [[services.ports]]
    port = 9002
    handlers = ['http']

[[vm]]
  size = 'performance-2x'
  memory = '4gb'
