# fly.toml app configuration file generated for soundcanvas-backend-20251201195552 on 2025-12-01T19:55:54-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'soundcanvas-backend-20251201195552'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'soundcanvas_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  
  # Extended timeout for music generation (default is 60s, we need more)
  [http_service.http_options]
    response.read_timeout = '5m'  # 5 minutes for music generation
    idle_timeout = '5m'
    response.write_timeout = '5m'

[[services]]
  protocol = 'tcp'
  internal_port = 9002
  processes = ['app']

  [[services.ports]]
    port = 9002
    handlers = ['http']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
