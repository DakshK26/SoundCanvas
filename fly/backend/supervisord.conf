[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mysql]
command=/usr/bin/mysqld_safe --datadir=/data/mysql
autostart=true
autorestart=true
priority=1

[program:minio]
command=/usr/local/bin/minio server /data/minio --console-address ":9090"
autostart=true
autorestart=true
priority=2
environment=MINIO_ROOT_USER=minioadmin,MINIO_ROOT_PASSWORD=minioadmin

[program:audio-renderer]
command=python app.py
directory=/app/audio-renderer
autostart=true
autorestart=true
priority=10
environment=PORT=9100

[program:audio-producer]
command=python app.py
directory=/app/audio-producer
autostart=true
autorestart=true
priority=10
environment=PORT=9101

[program:cpp-core]
command=./build/soundcanvas_core --serve
directory=/app/cpp-core
autostart=true
autorestart=true
priority=15

[program:gateway]
command=npm start
directory=/app/gateway
autostart=true
autorestart=true
priority=20
environment=PORT=4000
