[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:mysql]
command=/usr/bin/mysqld_safe --datadir=/data/mysql
autostart=true
autorestart=true
priority=1
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server /data/minio --address ":9002" --console-address ":9092"
autostart=true
autorestart=true
priority=2
startsecs=5
startretries=3
environment=MINIO_ROOT_USER=minioadmin,MINIO_ROOT_PASSWORD=minioadmin
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:audio-renderer]
command=python app.py
directory=/app/audio-renderer
autostart=true
autorestart=true
priority=10
environment=PORT="9100"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:audio-producer]
command=python app.py
directory=/app/audio-producer
autostart=true
autorestart=true
priority=10
environment=PORT="9101"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cpp-core]
command=/app/cpp-core/build/soundcanvas_core --serve
directory=/app/cpp-core
autostart=true
autorestart=true
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=node dist/index.js
directory=/app/gateway
autostart=true
autorestart=true
priority=20
environment=PORT="4000",HOST="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
