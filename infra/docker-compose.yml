# Runs the whole backend locally: LocalStack stands in for S3 and SQS, and a
# MySQL container stands in for RDS. Start with `docker compose up --build`
# from this folder, then run the frontend on http://localhost:3000 with
# NEXT_PUBLIC_GRAPHQL_ENDPOINT=http://localhost:4000/graphql.

x-gateway: &gateway
  build: ../gateway
  environment:
    AWS_REGION: us-east-2
    AWS_ACCESS_KEY_ID: test # LocalStack accepts any credentials
    AWS_SECRET_ACCESS_KEY: test
    AWS_ENDPOINT_URL: http://localhost.localstack.cloud:4566
    S3_BUCKET: soundcanvas-local
    SQS_QUEUE_URL: http://localhost.localstack.cloud:4566/000000000000/soundcanvas-jobs.fifo
    DB_HOST: mysql
    DB_USER: soundcanvas
    DB_PASSWORD: soundcanvas
    DB_NAME: soundcanvas
    FRONTEND_ORIGIN: http://localhost:3000
    CPP_CORE_URL: http://cpp-core:8080
    ML_URL: http://ml:5000
    AUDIO_PRODUCER_URL: http://audio-producer:9001

# The API and worker start only after the schema migration has finished.
x-after-migrate: &after-migrate
  depends_on:
    migrate: { condition: service_completed_successfully }
    localstack: { condition: service_started }

services:
  migrate:
    <<: *gateway
    command: ["npm", "run", "migrate"]
    depends_on:
      mysql: { condition: service_healthy }

  gateway-api:
    <<: [*gateway, *after-migrate]
    ports: ["4000:4000"]

  gateway-worker:
    <<: [*gateway, *after-migrate]
    command: ["npm", "run", "worker"]

  cpp-core:
    build: ../cpp-core

  ml:
    build: ../ml

  audio-producer:
    build: ../audio-producer

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: soundcanvas
      MYSQL_USER: soundcanvas
      MYSQL_PASSWORD: soundcanvas
    healthcheck: # ready once it accepts logins (the first start takes ~20 s to set up)
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usoundcanvas", "-psoundcanvas"]
      interval: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs
    ports: ["4566:4566"]
    volumes:
      - ./localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    networks:
      default:
        # localhost.localstack.cloud resolves to 127.0.0.1 on the internet, so the
        # browser reaches LocalStack through the published port. These aliases make
        # the same presigned URLs work from inside the gateway containers.
        aliases:
          - localhost.localstack.cloud
          - soundcanvas-local.localhost.localstack.cloud
